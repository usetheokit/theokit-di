name: Release

# theokit-di: di + di-agent + orm. Changesets-driven per-package release.
#
# AUTHENTICATION IS OIDC, NOT A TOKEN. Each of the three packages carries a Trusted Publisher
# connection on npmjs.com naming this repository and THIS FILE. npm mints a short-lived
# credential for the individual job, scoped to that package, and it cannot be exported or
# replayed. Renaming this file, or publishing from any other workflow, breaks the trust and the
# publish is rejected — that is the point of it.
#
# What it replaced: `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`, referring to a secret that did
# not exist in this repository or in the organization (`total_count: 0` in both). The workflow
# reported success because `changesets/action` finds no changeset and exits clean; the first real
# changeset would have reached the registry with no credential at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # The last line, for the path that reached a release without passing through a pull request.
  # If the declared channel and `.changeset/pre.json` disagree, this release would publish under
  # the wrong dist-tag — most expensively, a stable version onto `latest` after an accidental
  # `changeset pre exit`, with the publish reporting success.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]

  release:
    needs: release-channel
    name: Release via Changesets (theokit-di)
    runs-on: ubuntu-latest
    # Publishing three packages is minutes of work. A ceiling well under GitHub's 6-hour default
    # keeps a wedged job from holding a runner, and this is the job it costs the most to leave open.
    timeout-minutes: 30
    permissions:
      # changesets opens and updates the version pull request, and pushes its tags.
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for permission to publish. Without it there is no credential
      # at all now that the token is gone.
      id-token: write
    steps:
      # Actions pinned by commit SHA rather than by tag. This job can publish signed packages as
      # this organization, so whatever it runs must be a fixed commit. `changesets/action@v1` was
      # the sharpest edge: `v1` is not a tag in that repository, it is a BRANCH — any push to it
      # changed the code running here, with no release and no version bump to notice. Each pin
      # carries the version it resolved to on 2026-08-21, verified against the action's own tags.
      # Mint a short-lived token from the `theokit-release` GitHub App. GitHub does not start
      # workflow runs from GITHUB_TOKEN-authored events, so a Version Packages pull request
      # opened with that token arrives with none of its required checks running. An
      # App-authored event does start them. Proven on theokit-ui: the same change took its
      # version pull request from 0/3 required checks to 3/3, with no human gesture.
      #
      # The token is minted per run and expires with it. What is long-lived is the App's
      # private key, held as an organization secret, scoped to three repository permissions.
      # NOT used for npm — publishing stays OIDC trusted publishing, with no token at all.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what this job does rather than inheriting whatever the
          # installation holds. zizmor flags the unrestricted form as high severity.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # The one checkout in this repository that keeps its credential, and not
          # by oversight: changesets/action pushes the version commit and the
          # release tags with the git CLI, which authenticates from exactly this
          # persisted token. `persist-credentials: false` breaks the release.
          #
          # It must be the APP's token, not the default one. The push of
          # `changeset-release/main` is what the pull request is opened against, so a push
          # carrying the Actions bot's credential produces a bot-authored branch and the
          # checks stay dormant even though the pull request was opened by the App. Both
          # halves have to be the App or neither is.
          token: ${{ steps.app-token.outputs.token }}
          # changesets reads tags to decide what is unpublished; a shallow clone hides them.
          fetch-depth: 0

      # No `version:` — `packageManager` in package.json is already the authority on the pnpm
      # version, and pinning it twice creates two places to update.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc, for the same single-authority reason. It reads `22`, which resolves to the
          # latest 22.x — comfortably past the 22.14.0 that trusted publishing requires.
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
          # NO `registry-url`. It looks harmless and is not: setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc UNCONDITIONALLY and
          # points NPM_CONFIG_USERCONFIG at it, then exports NODE_AUTH_TOKEN only if the caller
          # supplied one — which, under OIDC, nobody does. The job would publish with a config
          # declaring a credential that does not exist. registry.npmjs.org is already the default,
          # and `publishConfig.access: public` in each manifest already covers the scope, so the
          # line bought nothing and left one more thing to go wrong on the first OIDC publish.

      # THE STEP WITHOUT WHICH THE OIDC CONFIGURATION IS CORRECT AND USELESS. `setup-node` ships
      # whatever npm the Node release bundles, and Node 22 bundles npm 10.9.7. OIDC needs npm
      # >= 11.5.1: an older npm does not know what to do with `id-token: write`, looks for a
      # credential, and finds none. changesets spawns `pnpm publish` (it detects the package
      # manager first — `@changesets/cli` `getPublishTool`), and pnpm reaches npm underneath, so
      # the npm on PATH is still the binary that authenticates and has to be new.
      #
      # Pinned to an exact version, not `@latest` or `@11`: this binary performs the publish, and a
      # new npm arriving on its own would be an unreviewed change to the release path. zizmor flags
      # the install as off-lockfile, which it is — there is no lockfile that can carry the npm that
      # installs the lockfile's packages.
      #
      # 11.9.0 AND NOT 12.x, and this is not conservatism. npm 12 breaks this release path in TWO
      # places, and the quiet one is the dangerous half.
      #
      # 1. Rejected flag (loud). changesets detects pnpm and appends `--no-git-checks`; the flag
      #    reaches npm, and npm 12 rejects unknown config with EUNKNOWNCONFIG where every earlier
      #    npm ignored it. Run 32476857554 failed on exactly that, for all three packages. npm
      #    reports the key without the negation, so the error names a flag nothing here wrote.
      #
      # 2. Blind registry check (silent). npm 12 returns an ARRAY from `npm info --json` where
      #    every earlier npm returned an object. changesets reads `response.pkgInfo.versions || []`
      #    — on an array that is `undefined`, so the list of published versions becomes empty and
      #    every package looks unpublished. Nothing errors; it simply tries to publish everything.
      #    Measured against the real registry with the bundle's own logic:
      #      npm 11.9.0 -> object, versions: 2 entries, includes("0.1.1") = true  (skips)
      #      npm 12.0.2 -> array,  versions: undefined, includes("0.1.1") = false (publishes)
      #
      # On that run the loud bug interrupted the silent one before it reached the registry. Do not
      # count on that ordering. The OIDC floor is still 11.5.1, so 11.9.0 is the newest npm that
      # satisfies both constraints. Bumping this to 12 does not cost a rejected flag — it costs
      # changesets the ability to see what is already published.
      - name: Install an npm that speaks OIDC (>= 11.5.1) but tolerates pnpm's publish flags
        uses: usetheokit/shared-workflows/actions/npm-oidc@v1 # zizmor: ignore[unpinned-uses]

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm install` runs the root `prepare` script, which points core.hooksPath at
      # `.githooks` — so the pre-commit secret scan is armed on this runner. changesets then
      # runs `git commit -m "Version Packages"`, the hook fires, finds no `trufflehog` binary,
      # and fails closed exactly as designed. Run 32478351961 died there, after the version bump
      # had already been computed correctly.
      #
      # The hook is right to fail closed and wrong to be armed here. It exists for the commit a
      # PERSON makes: CI can only catch a credential once it is already in the history, and the
      # hook is the last point where a leak is still free to fix. This commit is made by a bot,
      # from files it generated out of content already in the repository, onto
      # `changeset-release/main` — which reaches `main` only through a pull request, and
      # secret-scan.yml is configured to run on `pull_request` with base `main`, scanning
      # base..head.
      #
      # THE PARAGRAPH THAT USED TO SIT HERE IS NOW WRONG, and is corrected rather than deleted
      # because its reasoning still explains the design. It said the Version PR's checks do not
      # run by themselves, that a person must release them, and that the only alternative was a
      # PAT — which it rightly refused, since a PAT puts a long-lived credential back into the
      # job that publishes.
      #
      # The first two clauses were true of `secrets.GITHUB_TOKEN` and are no longer true here:
      # the App token above authors the pull request, so its checks — secret-scan included —
      # start on their own. The third was true only because the third option did not exist yet.
      # A GitHub App is not a PAT: it belongs to no person, carries three repository
      # permissions, and is revocable without touching anyone's access.
      #
      # What survives unchanged: no npm credential belongs in this job, and the refusal of a
      # PAT stands. Measured on theokit-ui before this was copied here.
      #
      # Unset rather than install trufflehog here: adding a network download to the job that
      # publishes buys a scan of generated version numbers that a later gate scans anyway.
      #
      # `|| true` because --unset exits 5 when the key is absent, and an absent key is already the
      # state this step wants. Without it, a release would fail for the opposite reason.
      - name: Disarm the local pre-commit hook for the bot's version commit
        run: git config --unset core.hooksPath || true

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          # The App's token, so the Version Packages pull request is authored by the App and its
          # required checks actually run. With `secrets.GITHUB_TOKEN` here the pull request opens
          # with nothing but the external Apps reporting, and stays unmergeable until a person
          # closes and reopens it. Nothing here authenticates to npm.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # NPM_CONFIG_PROVENANCE is gone on purpose, and the reason that does not depend on npm's
          # defaults is the local one: `publishConfig.provenance: true` already sits in all three
          # manifests, so provenance is declared beside the package it describes instead of in an
          # environment variable this file has to remember. npm also attaches the attestation by
          # default under trusted publishing — true, and the weaker of the two reasons.
