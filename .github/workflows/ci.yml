name: CI

# The four gates CONTRIBUTING.md names — check, typecheck, build, test — plus the three
# documentation gates, run where nobody can skip them. Until now this repository had no
# workflow that ran any of them: a pull request showed "all checks passed" on the strength
# of a secret scan alone, which says nothing about whether the code compiles.
#
# BOTH promotion legs are pull requests — workspace -> develop and develop -> main — so both
# bases are listed, exactly as secret-scan.yml already does. Listing only `main` would leave
# `develop`, the branch whose entire job is to integrate, accepting code CI never saw.
#
# `workspace` is deliberately absent from `push`: every promotion out of it is a pull request,
# so the pull_request trigger already covers that commit, and adding it here would run the
# same job twice on the same SHA.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Supersede in-flight runs, never on a protected branch: those runs are the record of what
# `main` and `develop` actually passed, and Release keys off main's state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# Nothing here writes. The default token is read-only so a compromised step in a build
# cannot push, tag or open anything.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (check, build, typecheck, test, docs)
    runs-on: ubuntu-latest
    # The whole suite is seconds of work. A ceiling far under GitHub's 6-hour default keeps
    # a wedged runner from holding a slot all afternoon.
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever controls the
      # action repository can repoint `v7` at different code, and it would run here with the
      # permissions of this workflow. This is the convention secret-scan.yml already follows;
      # release.yml still uses floating tags and should be moved to match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would let any later step,
          # or any tool reading the config, act as this repository.
          persist-credentials: false

      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      # Formatting and lint need nothing built, so they run first and fail in seconds rather
      # than after a build nobody needed.
      - name: Biome (lint + format)
        run: pnpm check

      # BUILD BEFORE TYPECHECK AND TEST, not after. `@theokit/di` is a `workspace:*`
      # dependency of both di-agent and orm, and it resolves through its `exports` map, which
      # points at `dist/`. On a developer machine a stale `dist/` hides this; on a fresh clone
      # typecheck fails outright. CONTRIBUTING.md lists the four gates as check, typecheck,
      # build, test — that reads as an order and does not work as one.
      - name: Build all packages (the types the later gates resolve against)
        run: pnpm build

      - name: TypeScript (no emit)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Last because two of the three read the EMITTED declarations under `dist/`, so they are
      # meaningless before the build above. A docblock in `src/` is not documentation until it
      # survives the rollup: `stripInternal` deletes a declaration outright when `@internal`
      # appears in its leading comments, and the rollup relocates comments on its own. The file
      # a consumer installs is the only one whose documentation is real.
      - name: Documentation gates (orphans, drift, coverage)
        run: pnpm quality:docs

  # SonarQube Cloud, from CI rather than Automatic Analysis.
  #
  # Automatic Analysis does not import coverage — "code coverage information is not supported" in
  # its own documentation — so on that mechanism this project reported bugs and smells while the
  # quality gate stayed blind to how much of the code the suite reaches.
  #
  # Automatic Analysis must be OFF for this project or the scanner refuses to run:
  # "You are running CI analysis while Automatic Analysis is enabled." Switched off 2026-09-01;
  # it is a UI toggle, the settings API refuses it with `cannot be set on a Project`.
  #
  # The coverage command is allowed to fail without failing the scan (the shared workflow marks it
  # continue-on-error and warns). `packages/di` does not currently meet its own 85% branch
  # threshold — 81.81% measured 2026-09-01 — and lowering the threshold to make the command exit 0
  # would buy a green line by deleting the measurement. The `--no-bail` in `test:coverage` is what
  # keeps that one failure from costing the other two packages their lcov entirely.
  sonar:
    needs: verify
    # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
    # caller without eleven pull requests, which is the reason that repository exists.
    uses: usetheokit/shared-workflows/.github/workflows/sonar.yml@v1 # zizmor: ignore[unpinned-uses]
    # Named rather than inherited: `secrets: inherit` would hand the scanner every secret
    # this repository holds.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # `@theokit/di` is a `workspace:*` dependency of di-agent and orm and resolves through its
      # `exports` map, which points at `dist/`. Without this the coverage run fails to resolve the
      # entry and the scan completes with no coverage at all — measured on theokit-sdk.
      build-command: pnpm build
      coverage-command: pnpm test:coverage

  # The channel this repository declares and the state changesets is actually in must agree.
  # `changeset pre exit`, a bad merge, or a conflict resolved the wrong way removes
  # `.changeset/pre.json`; nothing errors; the next release publishes a stable version and moves
  # the `latest` dist-tag for every consumer, reporting success. This is the pull-request half of
  # the gate — `release.yml` carries the other half, for the path that never passed through here.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every caller
      # without seven pull requests, which is the reason that repository exists.
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]
